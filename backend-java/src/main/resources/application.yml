spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: blood-connector-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/blood_connector}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:${SERVER_PORT:8080}}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-millis: ${JWT_EXPIRATION_MILLIS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
